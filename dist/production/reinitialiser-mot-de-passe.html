<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="robots" content="noindex,nofollow">
<title>Réinitialiser mon mot de passe · Yuki Trader Pro</title>
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
</head>
<body>
<div class="auth-screen">
  <div class="auth-card">
    <p class="eyebrow">YUKI TRADER PRO</p>
    <h1>Choisir un nouveau mot de passe</h1>

    <form id="resetForm">
      <label>
        <span>Nouveau mot de passe</span>
        <input id="newPassword" type="password" required minlength="8" autocomplete="new-password">
      </label>
      <label>
        <span>Confirmer le mot de passe</span>
        <input id="confirmPassword" type="password" required minlength="8" autocomplete="new-password">
      </label>
      <p class="muted tiny">Huit caractères minimum. Choisissez un mot de passe que vous n'utilisez nulle part ailleurs.</p>
      <button type="submit" class="primary full" id="submitBtn">Enregistrer le nouveau mot de passe</button>
    </form>

    <p id="statusMessage" class="auth-error"></p>
    <p><a class="legal-link" href="index.html">Retour à l'application</a></p>
  </div>
</div>

<script>
(function () {
  var form = document.getElementById("resetForm");
  var statusEl = document.getElementById("statusMessage");
  var submitBtn = document.getElementById("submitBtn");

  /* Le jeton arrive en paramètre d'URL. On ne l'affiche jamais et on ne le
     journalise pas : il vaut temporairement le mot de passe du compte. */
  var token = new URLSearchParams(window.location.search).get("token");

  function show(message, ok) {
    statusEl.textContent = message;
    statusEl.style.color = ok ? "#86efac" : "";
  }

  if (!token) {
    form.style.display = "none";
    show("Lien incomplet. Ouvrez le lien reçu par e-mail sans le modifier, ou demandez-en un nouveau depuis l'application.", false);
    return;
  }

  form.onsubmit = async function (e) {
    e.preventDefault();
    var pw = document.getElementById("newPassword").value;
    var confirm = document.getElementById("confirmPassword").value;

    if (pw.length < 8) { show("Le mot de passe doit contenir au moins 8 caractères.", false); return; }
    if (pw !== confirm) { show("Les deux mots de passe ne correspondent pas.", false); return; }

    submitBtn.disabled = true;
    show("Enregistrement en cours…", true);

    try {
      var base = (window.YUKI_API_BASE || "").replace(/\/+$/, "");
      var res = await fetch(base + "/api/auth/reset-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify({ token: token, password: pw })
      });
      var data = await res.json().catch(function () { return {}; });

      if (!res.ok) {
        show(data.error || data.message || "Ce lien est invalide ou a expiré. Veuillez en demander un nouveau.", false);
        submitBtn.disabled = false;
        return;
      }

      form.style.display = "none";
      show("Votre mot de passe a été modifié. Vous pouvez maintenant vous connecter.", true);
      setTimeout(function () { window.location.href = "index.html"; }, 2500);
    } catch (err) {
      show("Impossible de contacter le serveur. Vérifiez votre connexion et réessayez.", false);
      submitBtn.disabled = false;
    }
  };
})();
</script>
</body>
</html>
